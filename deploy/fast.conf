# Despliegue directo con atm-deploy (Mac -> VPS, sin GitHub Actions). Ver ../../tools/atm-deploy.
APP_DIR=/opt/messaging-api
PREBUILT=builder

fast_checks() {
	test -z "$(gofmt -l .)" || { gofmt -l .; return 1; }
	go vet ./...
}

# Compila cada `go build -o` del Dockerfile: un binario nuevo ahí no requiere tocar este archivo.
fast_build() { go_from_dockerfile; }
